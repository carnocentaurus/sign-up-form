<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link href="fonts/Brunson.woff2" type="font/woff2" rel="preload" as="font" crossorigin>
    <link href="fonts/Roboto-Regular.woff2" type="font/woff2" rel="preload" as="font" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="image-div">
        <div class="logo-div">
            <img src="images/form-svgrepo-com.svg" class="logo-img" alt="White form icon">
            <p class="logo-text">4ORM</p>
        </div>
    </div>

    <div class="form-content-div">
        <div class="text-div">
            <p class="paragraph">
                This is not a real service! You know you need something like this in your life
                to help you realize your deepest dreams. Sign up <i>now</i> to get started.
            </p>

            <p class="sentence">You <i>know</i> you want to.</p>
        </div>

        <form>
            <ul class="inputs-column-left-ul">
                <li>
                    <label>
                        FIRST NAME<br>
                        <input
                            type="text"
                            id="first-name-input"
                            name="first_name"
                            placeholder="John"
                        >
                    </label>
                </li>

                <li>
                    <label>
                        EMAIL<br>
                        <input
                            type="email"
                            id="email-input"
                            name="email"
                            placeholder="example@gmail.com"
                        >
                    </label>
                </li>

                <li>
                    <label>
                        PASSWORD<br>
                        <input
                            type="password"
                            id="password-input"
                            name="password"
                            placeholder="At least 8 characters"
                        >
                    </label>
                </li>
            </ul>

            <ul class="inputs-column-right-ul">
                <li>
                    <label>
                        LAST NAME<br>
                        <input
                            type="text"
                            id="last-name-input"
                            name="last_name"
                            placeholder="Doe"
                        >
                    </label>
                </li>

                <li>
                    <label>
                        PHONE NUMBER<br>
                        <input
                            type="tel"
                            id="phone-number-input"
                            name="phone_number"
                            placeholder="+1 (123) 456-7890"
                        >
                    </label>
                </li>

                <li>
                    <label>
                        CONFIRM PASSWORD<br>
                        <input
                            type="password"
                            id="confirm-password-input"
                            name="confirm_password"
                            placeholder="At least 8 characters"
                        >
                    </label>
                </li>
            </ul>
        </form>

        <div class="button-div">
            <button type="submit">Create Account</button>
            <p>Already have an account? <a>Log in</a></p>
        </div>
    </div>
    
</body>
</html>
